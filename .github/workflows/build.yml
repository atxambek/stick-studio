name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the project
        run: |
          ls -la
          for z in ./*.zip; do
            [ -f "$z" ] && unzip -q -o "$z"
          done
          P=$(find . -name pubspec.yaml -not -path "./.git/*" | head -1)
          if [ -z "$P" ]; then
            echo "pubspec.yaml topilmadi: zip yoki fayllar yuklanmagan"
            exit 1
          fi
          echo "APP_DIR=$(dirname "$P")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: |
          python3 tools/setup_android.py
          flutter pub get
          flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: stick-studio-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
